<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Quantum Forge">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Quantum Forge</title>
  <link rel="manifest" href="manifest.json">

  <!--
    NGL is vendored rather than pulled from a CDN, for two reasons that matter
    to a research tool:

      1. Reproducibility. `ngl.js` is pinned to an exact version whose SHA-256 is
         recorded in `web/ngl/README.md`, so a figure regenerated in two years
         renders identically. The previous CDN link pinned `2.0.0-dev.39` — a
         2017 pre-release — which was never the version this code was tested
         against.
      2. Availability. A reaction animation that depends on a third-party CDN
         being reachable is a liability in a seminar room or an offline lab
         machine.

    Both scripts are classic (non-module) scripts and must run before Flutter
    boots, since `main.dart.js` reads `window.NGL` and `window.QuantumForgeNgl`
    as soon as the first animation widget is built.
  -->
  <script src="ngl/ngl.js"></script>
  <script src="ngl/quantum_forge_ngl.js"></script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
