<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Quantum Forge">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Quantum Forge</title>
  <link rel="manifest" href="manifest.json">

  <!--
    NGL is vendored rather than pulled from a CDN, for two reasons that matter
    to a research tool:

      1. Reproducibility. `ngl.js` is pinned to an exact version whose SHA-256 is
         recorded in `web/ngl/README.md`, so a figure regenerated in two years
         renders identically. The previous CDN link pinned `2.0.0-dev.39` — a
         2017 pre-release — which was never the version this code was tested
         against.
      2. Availability. A reaction animation that depends on a third-party CDN
         being reachable is a liability in a seminar room or an offline lab
         machine.

    Both scripts are classic (non-module) scripts and must run before Flutter
    boots, since `main.dart.js` reads `window.NGL` and `window.QuantumForgeNgl`
    as soon as the first animation widget is built.
  -->
  <script src="ngl/ngl.js"></script>
  <script src="ngl/quantum_forge_ngl.js"></script>

  <!--
    Firebase is vendored for the same two reasons as NGL, and one more.

    FlutterFire loads the JS SDK at runtime from gstatic, which makes
    `Firebase.initializeApp()` a network operation. When that fetch stalls, the
    injected script's callback never fires, so FlutterFire's Dart Future never
    resolves — and `await Firebase.initializeApp(...)` hangs forever. That was a
    white screen, with only a `TypeError: Failed to fetch dynamically imported
    module` in the browser console to explain it.

    Loading the SDK from this origin removes the third-party fetch, so there is
    nothing to stall and no CORS to fail.

    Two details are load-bearing:

      * The globals must be the module *namespace objects*, which is why this
        uses `await import(...)`. A plain `<script src="firebase-app.js">` would
        define nothing, because an ES module sets no global.
      * These names are the contract `firebase_core_web` and friends read:
        `firebase_core`, `firebase_auth`, `firebase_firestore`. When
        `window.firebase_core` is already set, FlutterFire skips its own CDN
        injection entirely — that check is documented in
        `firebase_core_web.dart` ("or the user has added the scripts to their
        html file"), which is what makes this a supported setup rather than a
        fork.

    See `web/firebasejs/README.md` for the version, hashes and update procedure.
  -->
  <script type="module">
    (async () => {
      try {
        window.firebase_core = await import('./firebasejs/firebase-app.js');
        window.firebase_auth = await import('./firebasejs/firebase-auth.js');
        // Deliberately the `pipelines` bundle: the compiled app special-cases
        // firestore to request this file, not `firebase-firestore.js`.
        window.firebase_firestore =
          await import('./firebasejs/firebase-firestore-pipelines.js');
      } catch (error) {
        // Never fatal. Cloud features are optional by design — the app is fully
        // usable without an account and the library falls back to its bundled
        // templates — so a failure here must not stop Flutter from starting.
        console.warn(
          'Quantum Forge: local Firebase SDK failed to load; continuing ' +
            'without cloud features.',
          error,
        );
      }

      // Flutter is started only now, and only from here.
      //
      // A `type="module"` script is deferred, so if `flutter_bootstrap.js` were
      // still a static tag in this file the Flutter loader could run first —
      // and FlutterFire's "is firebase_core already present?" check would then
      // fire too early, fall back to injecting from the CDN, and fail in exactly
      // the way this vendoring exists to prevent. Injecting the bootstrap after
      // the assignments above removes that race.
      const bootstrap = document.createElement('script');
      bootstrap.src = 'flutter_bootstrap.js';
      document.body.appendChild(bootstrap);
    })();
  </script>
</head>
<body>
  <!--
    flutter_bootstrap.js is injected by the module script in <head>, not loaded
    here, so that the Firebase globals are in place before Flutter starts.
  -->
</body>
</html>
